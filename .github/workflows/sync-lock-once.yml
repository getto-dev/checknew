name: Sync lockfile once

on:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --package-lock-only
      - run: |
          rm -f .github/workflows/sync-lock-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/sync-lock-once.yml
          git commit -m "chore: sync lockfile after dependency cleanup"
          git push
