name: Bootstrap lockfile

on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Generate lockfile
        run: npm install --package-lock-only
      - name: Restore reproducible CI and remove bootstrap workflow
        run: |
          rm -f .github/workflows/bootstrap-deps.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/bootstrap-deps.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: sync package lock for checknew 2.0"
          git push
